version: '3.8'

services:
  # 1. Git-Frog Guardian Full-Stack Web App (React + Express + Gemini Server)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: git_frog_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - DATABASE_URL=postgresql://gitfrog:secretpass@postgres:5432/gitfrog_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gitfrog_net

  # 2. Mock Backend API Microservice (Enterprise Webhook & Audit Ingestion)
  mock-backend-api:
    image: node:20-alpine
    container_name: git_frog_mock_api
    restart: always
    working_dir: /app
    command: >
      sh -c "node -e '
      const http = require(\"http\");
      http.createServer((req, res) => {
        res.writeHead(200, { \"Content-Type\": \"application/json\" });
        res.end(JSON.stringify({ status: \"ok\", service: \"Git-Frog Ingestion API\", timestamp: new Date().toISOString() }));
      }).listen(4000, () => console.log(\"Mock Backend API listening on port 4000\"));
      '"
    ports:
      - "4000:4000"
    networks:
      - gitfrog_net

  # 3. PostgreSQL Database (Audit Records & User Settings Storage)
  postgres:
    image: postgres:16-alpine
    container_name: git_frog_postgres
    restart: always
    environment:
      POSTGRES_DB: gitfrog_db
      POSTGRES_USER: gitfrog
      POSTGRES_PASSWORD: secretpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitfrog -d gitfrog_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gitfrog_net

  # 4. Redis Container (Real-Time Websocket State & Rate Limiting Cache)
  redis:
    image: redis:7-alpine
    container_name: git_frog_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - gitfrog_net

volumes:
  pgdata:
  redisdata:

networks:
  gitfrog_net:
    driver: bridge
